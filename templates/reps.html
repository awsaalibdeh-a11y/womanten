<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Exercise with your camera · Womanten</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app.css">
<style>
  body { padding-bottom: 24px; }
  .stage { position: relative; border-radius: 20px; overflow: hidden; background: #000; border: 1px solid var(--line); aspect-ratio: 4 / 3; }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .stage .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--muted); }
  .count { font-size: 72px; font-weight: 300; text-align: center; line-height: 1; margin: 14px 0 4px; font-variant-numeric: tabular-nums; }
  .reward { text-align: center; color: var(--rose); min-height: 22px; }
  .status { text-align: center; color: #c9c9c9; margin: 10px 0; min-height: 48px; }
  a.back { display: inline-block; margin: 14px 0 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header class="top"><div class="brand"><i>&#9679;</i> Womanten</div><a class="back" href="/app" style="margin:0" id="back">Back to the app</a></header>
<main class="wrap">
  <h1 style="font-size:24px">Exercise with your camera</h1>
  <p class="muted tiny" id="intro">Pick an exercise and I will count your reps. The video is analysed in this window and never saved or sent anywhere.</p>
  <div class="pills" id="picker"></div>
  <div class="stage"><video id="vid" playsinline muted></video><canvas id="cv"></canvas><div class="ph" id="ph">Tap Start camera when you are ready.</div></div>
  <div class="count" id="count">0</div>
  <div class="reward" id="reward"></div>
  <div class="status" id="status"></div>
  <div class="pills" style="justify-content:center"><button id="go">Start camera</button><button class="ghost" id="stop" hidden>Stop</button></div>
  <p class="muted tiny" style="text-align:center;margin-top:12px" id="note"></p>
</main>
<script src="/static/counters.js"></script>
<script type="module" src="/static/reps.js"></script>
</body>
</html>
